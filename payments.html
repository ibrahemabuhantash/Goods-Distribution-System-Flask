{% extends 'base.html' %}{% block content %}<h1>المدفوعات</h1><form method="post" class="card form-row"><select name="order_id">{% for o in orders %}<option value="{{o.id}}">#{{o.id}} - {{o.customer}} - {{o.total}}</option>{% endfor %}</select><input name="amount" type="number" step="0.01" placeholder="المبلغ"><select name="method"><option>نقدي</option><option>محفظة</option><option>بطاقة</option></select><button>تسجيل</button></form><table><tr><th>#</th><th>العميل</th><th>المبلغ</th><th>الطريقة</th><th>التاريخ</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.customer}}</td><td>{{r.amount}}</td><td>{{r.method}}</td><td>{{r.paid_at}}</td></tr>{% endfor %}</table>{% endblock %}
