{% extends 'base.html' %}{% block content %}<h1>الشحنات</h1><form method="post" class="card form-row"><select name="order_id">{% for o in orders %}<option value="{{o.id}}">#{{o.id}} - {{o.customer}}</option>{% endfor %}</select><select name="driver_id">{% for d in drivers %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select><select name="vehicle_id">{% for v in vehicles %}<option value="{{v.id}}">{{v.plate_no}}</option>{% endfor %}</select><input type="date" name="delivery_date"><input name="notes" placeholder="ملاحظات"><button>جدولة</button></form><table><tr><th>#</th><th>العميل</th><th>السائق</th><th>المركبة</th><th>الحالة</th><th>التاريخ</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.customer}}</td><td>{{r.driver}}</td><td>{{r.vehicle}}</td><td>{{r.status}}</td><td>{{r.delivery_date}}</td></tr>{% endfor %}</table>{% endblock %}
