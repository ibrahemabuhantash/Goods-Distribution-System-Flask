{% extends 'base.html' %}{% block content %}<h1>الطلبات</h1><form method="post" class="card form-row"><select name="customer_id" required><option value="">اختر العميل</option>{% for c in customers %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><select name="product_id" required><option value="">اختر المنتج</option>{% for p in products %}<option value="{{p.id}}">{{p.name}} - {{p.price}} - متوفر {{p.quantity}}</option>{% endfor %}</select><input name="quantity" type="number" min="1" placeholder="الكمية" required><input name="notes" placeholder="ملاحظات"><button>إنشاء طلب</button></form><a class="btn" href="/export/orders.csv">تصدير CSV</a><table><tr><th>#</th><th>العميل</th><th>الحالة</th><th>الإجمالي</th><th>تحديث</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.customer}}</td><td>{{r.status}}</td><td>{{r.total}}</td><td><form method="post" action="/orders/status/{{r.id}}"><select name="status">{% for s in statuses %}<option {% if s==r.status %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button>حفظ</button></form></td></tr>{% endfor %}</table>{% endblock %}
