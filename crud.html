{% extends 'base.html' %}{% block content %}<h1>{{title}}</h1><form method="post" action="/{{table}}/add" class="card form-row">{% for c,l in columns %}<input name="{{c}}" placeholder="{{l}}" {% if loop.first %}required{% endif %}>{% endfor %}<button>إضافة</button></form><table><tr><th>#</th>{% for c,l in columns %}<th>{{l}}</th>{% endfor %}<th>إجراء</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td>{% for c,l in columns %}<td>{{r[c]}}</td>{% endfor %}<td><a class="danger-link" href="/{{table}}/delete/{{r.id}}">حذف</a></td></tr>{% endfor %}</table>{% endblock %}
